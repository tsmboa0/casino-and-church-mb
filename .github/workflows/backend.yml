name: backend

on:
  push:
  pull_request:

jobs:
  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain
      - name: unit tests
        working-directory: onchain
        run: cargo test -p realm --release --locked
      - name: python tables
        run: python3 -I scripts/rtp_check.py

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @cnc/shared test
      - run: pnpm --filter @cnc/realm test
      - run: pnpm --filter server test
      - run: pnpm --filter @cnc/sim vectors
      - run: pnpm --filter @cnc/sim sim
      - run: node scripts/e2e.mjs
